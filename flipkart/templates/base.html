{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Flipkart Admin
        {% endblock %}
    </title>


    <!-- ================================
         BOOTSTRAP
    ================================= -->
    <link rel="stylesheet"
          href="{% static 'css/bootstrap.min.css' %}">


    <!-- ================================
         FONT AWESOME
    ================================= -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- ================================
         SPLIDE CSS
    ================================= -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">


    <!-- ================================
         CUSTOM CSS
    ================================= -->
    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">


    <!-- ================================
         ADMIN BASE STYLE
    ================================= -->
    <style>

        /* =================================
           GLOBAL
        ================================= */

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            background: #f6f8fb;

            color: #212529;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            min-height: 100vh;
        }


        /* =================================
           PAGE CONTENT
        ================================= */

        .main-wrapper {
            min-height: calc(100vh - 150px);
        }


        /* =================================
           ADMIN NAVIGATION
        ================================= */

        .admin-nav-wrapper {

            padding: 12px 0;

            background: #ffffff;

            border-bottom: 1px solid #e9ecef;

            position: sticky;

            top: 0;

            z-index: 1000;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.04);
        }


        .admin-nav {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        .admin-back-btn {

            display: inline-flex;

            align-items: center;

            gap: 12px;

            padding: 8px 16px 8px 9px;

            text-decoration: none;

            background: #ffffff;

            color: #212529;

            border: 1px solid #e1e5eb;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.04);

            transition: all 0.25s ease;
        }


        .admin-back-btn:hover {

            color: #0d6efd;

            border-color: #0d6efd;

            transform: translateX(-3px);

            box-shadow:
                0 6px 18px rgba(13, 110, 253, 0.10);
        }


        .admin-back-icon {

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #0d6efd;

            color: #ffffff;

            border-radius: 10px;

            transition: all 0.25s ease;
        }


        .admin-back-btn:hover .admin-back-icon {

            transform: translateX(-2px);

            background: #0b5ed7;
        }


        .admin-back-btn small {

            display: block;

            font-size: 10px;

            line-height: 12px;

            color: #8a94a6;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            font-weight: 600;
        }


        .admin-back-btn strong {

            display: block;

            font-size: 14px;

            line-height: 18px;

            font-weight: 600;
        }


        /* =================================
           ADMIN BADGE
        ================================= */

        .admin-panel-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 7px 12px;

            border-radius: 20px;

            background: #eef5ff;

            color: #0d6efd;

            font-size: 12px;

            font-weight: 600;
        }


        .admin-panel-badge i {

            font-size: 12px;
        }


        /* =================================
           CONTENT CONTAINER
        ================================= */

        .page-container {

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

            padding: 30px 20px;
        }


        /* =================================
           FOOTER
        ================================= */

        footer {

            margin-top: auto;
        }


        /* =================================
           LINKS
        ================================= */

        a {

            transition: all 0.2s ease;
        }


        /* =================================
           BUTTON
        ================================= */

        .btn {

            border-radius: 8px;

            font-weight: 500;

            transition: all 0.2s ease;
        }


        .btn:hover {

            transform: translateY(-1px);
        }


        /* =================================
           CARD
        ================================= */

        .card {

            border: 1px solid #e9edf2;

            border-radius: 14px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.04);
        }


        /* =================================
           FORM CONTROL
        ================================= */

        .form-control,
        .form-select {

            border-radius: 9px;

            border-color: #dfe4ea;

            padding: 10px 13px;

            transition: all 0.2s ease;
        }


        .form-control:focus,
        .form-select:focus {

            border-color: #86b7fe;

            box-shadow:
                0 0 0 0.2rem rgba(13, 110, 253, 0.10);
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 768px) {

            .admin-nav-wrapper {

                padding: 10px 0;
            }


            .admin-nav {

                align-items: flex-start;
            }


            .admin-panel-badge {

                display: none;
            }


            .admin-back-btn {

                padding-right: 12px;
            }


            .admin-back-btn strong {

                font-size: 13px;
            }


            .page-container {

                padding: 20px 14px;
            }

        }


        @media (max-width: 480px) {

            .admin-back-icon {

                width: 34px;

                height: 34px;
            }


            .admin-back-btn {

                gap: 9px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         NAVBAR
    ================================= -->

    {% include 'includes/navbar.html' %}


    <!-- =================================
         ADMIN NAVIGATION
         ONLY STAFF / ADMIN CAN SEE
    ================================= -->

    {% if user.is_staff %}

    <div class="admin-nav-wrapper">

        <div class="container">

            <div class="admin-nav">

                <a href="{% url 'admin_dashboard' %}"
                   class="admin-back-btn">

                    <span class="admin-back-icon">

                        <i class="fa-solid fa-arrow-left"></i>

                    </span>


                    <span>

                        <small>Admin Panel</small>

                        <strong>
                            Back to Dashboard
                        </strong>

                    </span>

                </a>


                <span class="admin-panel-badge">

                    <i class="fa-solid fa-shield-halved"></i>

                    Admin Mode

                </span>

            </div>

        </div>

    </div>

    {% endif %}


    <!-- =================================
         MAIN CONTENT
    ================================= -->

    <main class="main-wrapper">

        {% block content %}

        {% endblock %}

    </main>


    <!-- =================================
         FOOTER
    ================================= -->

    {% include 'includes/footer.html' %}


    <!-- =================================
         BOOTSTRAP JS
    ================================= -->

    <script src="{% static 'js/bootstrap.bundle.min.js' %}">
    </script>


    <!-- =================================
         CUSTOM JS
    ================================= -->

    <script src="{% static 'js/script.js' %}">
    </script>


    <!-- =================================
         SPLIDE JS
    ================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js">
    </script>


</body>

</html>
